<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ikman Scraper | BY LORD INDUMINA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body {
            background: #0a0a0c;
            color: #e0e0e0;
            font-family: 'Rajdhani', sans-serif;
        }
        .anime-title {
            font-family: 'Orbitron', sans-serif;
            text-shadow: 0 0 10px #10b981, 0 0 20px #10b981;
        }
        .cyber-card {
            background: rgba(20, 20, 25, 0.8);
            border: 1px solid rgba(16, 185, 129, 0.2);
            backdrop-filter: blur(10px);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .cyber-card:hover {
            border-color: #10b981;
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.4);
            transform: scale(1.02);
        }
        .search-glow:focus {
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.5);
        }
        .price-tag {
            background: linear-gradient(90deg, #059669, #10b981);
            clip-path: polygon(10% 0%, 100% 0%, 90% 100%, 0% 100%);
        }
        .loader {
            width: 80px;
            height: 80px;
            border: 5px solid #1a1a1a;
            border-top: 5px solid #10b981;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        /* Floating Animation for Header */
        .float { animation: floating 3s ease-in-out infinite; }
        @keyframes floating {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
    </style>
</head>
<body class="min-h-screen">

    <div class="container mx-auto py-10 px-4">
        <header class="text-center mb-12">
            <div class="float inline-block">
                <h1 class="text-6xl font-black text-green-500 mb-2 anime-title italic tracking-tighter">IKMAN HUNTER</h1>
            </div>
            <p class="text-gray-400 font-medium tracking-widest uppercase text-sm">System Accessed by Lord Indumina • V2.0</p>
            <div class="mt-4 inline-block border border-green-500/30 bg-green-500/10 text-green-400 text-[10px] px-6 py-1 rounded-sm font-bold uppercase tracking-[0.3em]">
                Authorized Shinobi Developer
            </div>
        </header>
        
        <div class="flex max-w-2xl mx-auto mb-12 relative group">
            <div class="absolute -inset-1 bg-green-500 rounded-lg blur opacity-25 group-hover:opacity-50 transition duration-1000"></div>
            <div class="relative flex w-full bg-gray-900 rounded-lg overflow-hidden border border-gray-700">
                <input type="text" id="keyword" placeholder="Enter Target (e.g. iPhone 15, Vitz)..." 
                    class="w-full bg-transparent p-5 text-white focus:outline-none text-lg search-glow font-semibold">
                <button onclick="search()" class="bg-green-600 hover:bg-green-500 text-black px-10 font-black transition-all flex items-center gap-3 uppercase tracking-tighter italic">
                    <i class="fas fa-crosshairs"></i> SCAN
                </button>
            </div>
        </div>

        <div class="max-w-2xl mx-auto mb-12 bg-black/50 border-l-4 border-green-500 p-4 rounded-r-lg shadow-2xl">
            <div class="flex items-center gap-3 mb-1">
                <i class="fas fa-terminal text-green-500 text-xs"></i>
                <span class="text-gray-500 text-[10px] font-bold tracking-widest uppercase">Direct API Access</span>
            </div>
            <code class="text-sm font-mono"><span class="text-blue-400">GET</span> <span class="text-green-400">/api/search?q=</span><span class="text-yellow-400 font-bold">{item_name}</span></code>
        </div>

        <div id="loading" class="hidden text-center py-20">
            <div class="loader inline-block mb-4"></div>
            <p class="text-green-500 font-bold tracking-[0.5em] animate-pulse">EXTRACTING DATA...</p>
        </div>

        <div id="results" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8"></div>
    </div>

    <footer class="text-center py-10 border-t border-gray-800/50 mt-10">
        <p class="text-gray-600 text-[10px] tracking-[0.4em] uppercase font-bold">
            Project: <span class="text-green-500">Ikman Scraper</span> | Core Logic by 
            <span class="text-gray-300">Lord Indumina</span>
        </p>
    </footer>

    <script>
        async function search() {
            const keyword = document.getElementById('keyword').value;
            const resultsDiv = document.getElementById('results');
            const loading = document.getElementById('loading');

            if (!keyword) return alert("Identify your target first, machan!");

            resultsDiv.innerHTML = "";
            loading.classList.remove('hidden');

            try {
                const response = await fetch(`/api/search?q=${encodeURIComponent(keyword)}`);
                const result = await response.json();
                
                loading.classList.add('hidden');

                if (!result.success || result.data.length === 0) {
                    resultsDiv.innerHTML = `
                        <div class="col-span-full text-center py-20 bg-gray-900/50 rounded-3xl border border-dashed border-gray-700">
                            <i class="fas fa-ghost text-6xl text-gray-700 mb-6 animate-bounce"></i>
                            <p class="text-2xl text-gray-500 font-bold tracking-widest uppercase italic">Target Not Found in Database!</p>
                        </div>`;
                    return;
                }

                result.data.forEach(item => {
                    resultsDiv.innerHTML += `
                        <div class="cyber-card rounded-xl shadow-2xl overflow-hidden group">
                            <div class="relative overflow-hidden">
                                <img src="${item.image}" class="w-full h-56 object-cover opacity-80 group-hover:opacity-100 transition duration-500 group-hover:scale-110" alt="item">
                                <div class="price-tag absolute bottom-0 right-0 px-6 py-2 text-black font-black text-lg shadow-2xl">
                                    ${item.price}
                                </div>
                                <div class="absolute top-0 left-0 p-2">
                                    <div class="bg-black/60 text-[8px] px-2 py-1 rounded border border-green-500/30 text-green-500 font-bold uppercase tracking-tighter">Live Intel</div>
                                </div>
                            </div>
                            <div class="p-6">
                                <h2 class="text-lg font-bold text-gray-100 h-14 overflow-hidden mb-4 leading-tight group-hover:text-green-400 transition-colors uppercase tracking-tight">${item.title}</h2>
                                <div class="flex items-center text-gray-400 text-xs mb-6 font-bold tracking-wider">
                                    <i class="fas fa-map-marker-alt mr-2 text-green-500"></i>
                                    <span class="uppercase">${item.info}</span>
                                </div>
                                <a href="${item.link}" target="_blank" class="relative group/btn block text-center overflow-hidden py-3 rounded-lg border border-green-500/50">
                                    <span class="relative z-10 text-green-500 group-hover/btn:text-black font-black uppercase italic tracking-tighter transition-colors duration-300">View Classified Ad</span>
                                    <div class="absolute inset-0 bg-green-500 translate-y-[101%] group-hover/btn:translate-y-0 transition-transform duration-300"></div>
                                </a>
                            </div>
                        </div>
                    `;
                });
            } catch (err) {
                loading.classList.add('hidden');
                alert("Critical System Error: API Connection Failed!");
            }
        }
    </script>
</body>
</html>
